<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="歩行練習確認表">
<title>歩行練習確認表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:16px;line-height:1.5;}

.root{
  --bg:#ffffff;--bg2:#f4f4f4;--bg3:#e8e8e8;
  --t1:#111111;--t2:#444444;--t3:#888888;
  --bd:rgba(0,0,0,0.15);--bd2:rgba(0,0,0,0.28);
  --cbg:#ffffff;
  --yn:#FFEE58;--yb:#e6c800;--yt:#1a1400;
  --glight:#E1F5EE;--gcard:#E8F8F0;--gborder:#1D9E75;--gborder2:#5DCAA5;--gtext:#04342C;--gmid:#1D9E75;
  background:var(--bg);color:var(--t1);
  min-height:100vh;
  padding:0 0 40px 0;
  transition:background .3s,color .3s;
}
.root.night{
  --bg:#111111;--bg2:#1c1c1c;--bg3:#282828;
  --t1:#f0f0f0;--t2:#aaaaaa;--t3:#666666;
  --bd:rgba(255,255,255,0.13);--bd2:rgba(255,255,255,0.25);
  --cbg:#181818;
  --yn:#4a3e00;--yb:#665500;--yt:#f0d84a;
  --glight:#06221a;--gcard:#091f17;--gborder:#1D9E75;--gborder2:#085041;--gtext:#5DCAA5;--gmid:#1D9E75;
}

.wrap{max-width:480px;margin:0 auto;padding:12px 14px 0;}
.screen{display:none;}
.screen.active{display:block;}

.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.title-block{background:var(--yn);border:1px solid var(--yb);border-radius:8px;padding:6px 10px;text-align:center;flex-shrink:0;}
.title-block div{font-size:13px;font-weight:600;color:var(--yt);line-height:1.3;}
.date-label{flex:1;font-size:15px;font-weight:500;color:var(--t1);text-align:center;}
.icon-btn{width:46px;height:46px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:active{opacity:0.6;}
.icon-btn svg{width:22px;height:22px;stroke:var(--t2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--bg2);border-radius:10px;padding:12px 14px;}
.stat-lbl{font-size:13px;color:var(--t3);margin-bottom:4px;}
.stat-val{font-size:26px;font-weight:600;color:var(--t1);}

.clear-btn{width:100%;padding:14px;margin-bottom:14px;border-radius:10px;font-size:16px;cursor:pointer;background:var(--yn);border:1px solid var(--yb);color:var(--yt);font-weight:600;}
.clear-btn:active{opacity:0.7;}

.pcard{background:var(--cbg);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s,background .2s;}
.pcard.chk{border-color:var(--gborder);background:var(--gcard);}
.card-top{display:flex;align-items:stretch;}
.name-col{width:90px;min-width:90px;padding:14px 8px;border-right:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.pcard.chk .name-col{border-right-color:var(--gborder2);}
.name-main{font-size:17px;font-weight:600;color:var(--t1);text-align:center;line-height:1.5;}
.name-hon{font-size:13px;color:var(--t3);margin-top:2px;}
.content-col{flex:1;padding:12px 10px;display:flex;align-items:center;}
.content-text{font-size:14px;color:var(--t2);line-height:1.75;}
.pcard.chk .content-text{color:var(--gtext);}
.check-col{display:flex;align-items:center;justify-content:center;padding:0 12px;border-left:1px solid var(--bd);cursor:pointer;}
.pcard.chk .check-col{border-left-color:var(--gborder2);}
.chkbox{width:42px;height:42px;border:2px solid var(--bd2);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.chkbox.on{background:var(--gmid);border-color:var(--gmid);}
.chkbox svg{display:none;width:24px;height:24px;}
.chkbox.on svg{display:block;}
.time-row{border-top:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:8px;}
.pcard.chk .time-row{border-top-color:var(--gborder2);}
.time-lbl{font-size:13px;color:var(--t3);}
.time-val{font-size:14px;color:var(--t2);}

.mgmt-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back-btn{width:46px;height:46px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn:active{opacity:0.6;}
.back-btn svg{width:22px;height:22px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.mgmt-title{flex:1;font-size:18px;font-weight:600;color:var(--t1);}
.add-btn{padding:11px 16px;border-radius:10px;border:1px solid var(--gmid);background:var(--glight);color:var(--gtext);font-size:15px;font-weight:600;cursor:pointer;}
.add-btn:active{opacity:0.7;}

.mcard{background:var(--cbg);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;display:flex;align-items:center;overflow:hidden;}
.mcard-name{padding:14px 12px;font-size:15px;font-weight:600;color:var(--t1);min-width:88px;flex-shrink:0;border-right:1px solid var(--bd);line-height:1.5;}
.mcard-name span{display:block;font-size:12px;color:var(--t3);font-weight:400;}
.mcard-content{flex:1;padding:10px;font-size:13px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mcard-actions{display:flex;flex-direction:column;border-left:1px solid var(--bd);flex-shrink:0;}
.act-btn{width:50px;height:42px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.act-btn:active{background:var(--bg2);}
.act-btn svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.act-btn.edit svg{stroke:#378ADD;}
.act-btn.del svg{stroke:#E24B4A;}
.act-div{height:1px;background:var(--bd);}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.overlay.open{display:flex;}
.modal{background:var(--cbg);border:1px solid var(--bd2);border-radius:16px;padding:1.5rem;width:100%;max-width:340px;}
.modal h3{font-size:18px;font-weight:600;color:var(--t1);margin-bottom:1.25rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:14px;color:var(--t2);margin-bottom:6px;}
.field input,.field textarea{width:100%;font-size:16px;border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;background:var(--bg2);color:var(--t1);font-family:inherit;appearance:none;-webkit-appearance:none;}
.field textarea{resize:vertical;min-height:90px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;margin-top:1.25rem;}
.modal-btns button{flex:1;padding:13px;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;}
.btn-save{background:var(--gmid);color:#fff;border:none;font-weight:600;}
.btn-save:active{opacity:0.8;}
.btn-cancel{background:none;border:1px solid var(--bd2);color:var(--t2);}
.btn-cancel:active{background:var(--bg2);}
</style>
</head>
<body>
<div class="root" id="root">

<div class="wrap">

<!-- チェック画面 -->
<div id="screenCheck" class="screen active">
  <div class="top-bar">
    <div class="title-block"><div>歩行練習</div><div>確認表</div></div>
    <div class="date-label" id="dateLabel"></div>
    <button class="icon-btn" onclick="toggleNight()" id="nightBtn" title="ナイトモード">
      <svg id="iconNight" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/></svg>
    </button>
    <button class="icon-btn" onclick="showScreen('mgmt')" title="入居者管理">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
    </button>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="stat-lbl">完了人数</div><div class="stat-val" id="statDone">0 / 0</div></div>
    <div class="stat"><div class="stat-lbl">完了率</div><div class="stat-val" id="statPct">0%</div></div>
  </div>
  <button class="clear-btn" onclick="clearAll()">本日のチェックをリセット</button>
  <div id="patientList"></div>
</div>

<!-- 管理画面 -->
<div id="screenMgmt" class="screen">
  <div class="mgmt-header">
    <button class="back-btn" onclick="showScreen('check')"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
    <span class="mgmt-title">入居者の管理</span>
    <button class="add-btn" onclick="openModal(null)">＋ 追加</button>
  </div>
  <div id="mgmtList"></div>
</div>

</div><!-- /wrap -->

<!-- モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">入居者を追加</h3>
    <div class="field"><label>姓（名字）</label><input type="text" id="fLast" placeholder="例：小川" maxlength="10"></div>
    <div class="field"><label>名（名前）</label><input type="text" id="fFirst" placeholder="例：耕三" maxlength="10"></div>
    <div class="field"><label>練習内容</label><textarea id="fContent" placeholder="例：歩行器使用にてフロア1周　付き添い"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

</div><!-- /root -->

<script>
const PKEY='walk_pts_v1',CKEY='walk_chk_v1',NKEY='walk_night_v1';
const TODAY=new Date();
const dateKey=TODAY.getFullYear()+'-'+(TODAY.getMonth()+1)+'-'+TODAY.getDate();

const DEFAULT=[
  {id:1,last:'小川',first:'耕三',content:'詰所前のサイドバーを左側(フロア側から開始)で持ち、④番トイレ前まで詰所周りしバックで元の位置まで戻る'},
  {id:2,last:'中村',first:'榮代',content:'歩行練習の声掛け　遠視見守り'},
  {id:3,last:'三橋',first:'和夫',content:'1日/1回、杖歩行練習　フロア1周\n※詰所前手すりでの歩行自己練習はOK'},
  {id:4,last:'石井',first:'武子',content:'歩行器使用にてフロア1周　付き添い'},
  {id:5,last:'谷口',first:'敏子',content:'間食時の行き帰りにバギー使用、職員付き添い'},
  {id:6,last:'橋本',first:'周子',content:'詰所前のサイドバーを左側(フロア側から開始)で持ち、④番トイレ前まで詰所周り半周\n※車椅子も一緒に\n※職員はふらつかない様、付き添う\n膝折れ時に直ぐ支える事が出来るようにお願いします'},
  {id:7,last:'中井',first:'佐太郎',content:'タッチアップ歩行器使用　フロア1周(付き添い)'},
  {id:8,last:'大久保',first:'ヨメノ',content:'歩行器使用にてフロア1周　付き添い(喫煙室管理)'},
  {id:9,last:'池田',first:'晴美',content:'歩行器使用にてフロア1〜2周　付き添い(喫煙室管理)'},
  {id:10,last:'宮田',first:'芙美子',content:'間食前の離床時203へ大回りしてテーブル席まで、杖歩行'},
];

let patients=[],checks={},editingId=null,nextId=100,isNight=false;

function init(){
  try{const d=JSON.parse(localStorage.getItem(PKEY));if(d){patients=d.list||[...DEFAULT];nextId=d.nextId||nextId;}else patients=[...DEFAULT];}catch(e){patients=[...DEFAULT];}
  try{const d=JSON.parse(localStorage.getItem(CKEY));if(d&&d.key===dateKey)checks=d.checks||{};}catch(e){}
  try{isNight=localStorage.getItem(NKEY)==='1';applyNight();}catch(e){}
  renderCheck();renderMgmt();
}

function savePts(){try{localStorage.setItem(PKEY,JSON.stringify({list:patients,nextId}));}catch(e){}}
function saveChk(){try{localStorage.setItem(CKEY,JSON.stringify({key:dateKey,checks}));}catch(e){}}

function applyNight(){
  const r=document.getElementById('root');
  const ic=document.getElementById('iconNight');
  if(isNight){
    r.classList.add('night');
    ic.innerHTML='<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }else{
    r.classList.remove('night');
    ic.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>';
  }
}

function toggleNight(){
  isNight=!isNight;
  applyNight();
  try{localStorage.setItem(NKEY,isNight?'1':'0');}catch(e){}
}

function fmt(d){
  var w=['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日（'+w[d.getDay()]+'）';
}

function showScreen(n){
  document.getElementById('screenCheck').className='screen'+(n==='check'?' active':'');
  document.getElementById('screenMgmt').className='screen'+(n==='mgmt'?' active':'');
}

function toggleCheck(id){
  if(checks[id])delete checks[id];
  else{
    var now=new Date();
    var h=String(now.getHours()).padStart(2,'0');
    var m=String(now.getMinutes()).padStart(2,'0');
    checks[id]={time:h+':'+m};
  }
  saveChk();renderCheck();
}

function clearAll(){
  if(!confirm('本日のチェックをすべてリセットしますか？'))return;
  checks={};saveChk();renderCheck();
}

function renderCheck(){
  document.getElementById('dateLabel').textContent=fmt(TODAY);
  var done=Object.keys(checks).length,total=patients.length;
  document.getElementById('statDone').textContent=done+' / '+total;
  document.getElementById('statPct').textContent=(total?Math.round(done/total*100):0)+'%';
  var list=document.getElementById('patientList');list.innerHTML='';
  patients.forEach(function(p){
    var chk=checks[p.id];
    var card=document.createElement('div');
    card.className='pcard'+(chk?' chk':'');
    var timeRow=chk?'<div class="time-row"><span class="time-lbl">完了時刻</span><span class="time-val">'+chk.time+'</span></div>':'';
    card.innerHTML='<div class="card-top">'
      +'<div class="name-col"><div class="name-main">'+p.last+'<br>'+p.first+'</div><div class="name-hon">様</div></div>'
      +'<div class="content-col"><div class="content-text">'+p.content.replace(/\n/g,'<br>')+'</div></div>'
      +'<div class="check-col" onclick="toggleCheck('+p.id+')">'
      +'<div class="chkbox'+(chk?' on':'')+'">'
      +'<svg viewBox="0 0 22 22" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,11 9,16 18,5"/></svg>'
      +'</div></div></div>'+timeRow;
    list.appendChild(card);
  });
}

function renderMgmt(){
  var list=document.getElementById('mgmtList');list.innerHTML='';
  patients.forEach(function(p){
    var card=document.createElement('div');card.className='mcard';
    card.innerHTML='<div class="mcard-name">'+p.last+' '+p.first+'<span>様</span></div>'
      +'<div class="mcard-content">'+p.content+'</div>'
      +'<div class="mcard-actions">'
      +'<button class="act-btn edit" onclick="openModal('+p.id+')">'
      +'<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
      +'</button><div class="act-div"></div>'
      +'<button class="act-btn del" onclick="deletePatient('+p.id+')">'
      +'<svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>'
      +'</button></div>';
    list.appendChild(card);
  });
}

function openModal(id){
  editingId=id;
  if(id===null){
    document.getElementById('modalTitle').textContent='入居者を追加';
    document.getElementById('fLast').value='';
    document.getElementById('fFirst').value='';
    document.getElementById('fContent').value='';
  }else{
    var p=patients.find(function(x){return x.id===id;});
    document.getElementById('modalTitle').textContent='内容を編集';
    document.getElementById('fLast').value=p.last;
    document.getElementById('fFirst').value=p.first;
    document.getElementById('fContent').value=p.content;
  }
  document.getElementById('overlay').className='overlay open';
}

function closeModal(){document.getElementById('overlay').className='overlay';}

function saveModal(){
  var last=document.getElementById('fLast').value.trim();
  var first=document.getElementById('fFirst').value.trim();
  var content=document.getElementById('fContent').value.trim();
  if(!last||!first){alert('姓と名を入力してください');return;}
  if(!content){alert('練習内容を入力してください');return;}
  if(editingId===null){
    patients.push({id:nextId++,last:last,first:first,content:content});
  }else{
    var p=patients.find(function(x){return x.id===editingId;});
    p.last=last;p.first=first;p.content=content;
  }
  savePts();closeModal();renderCheck();renderMgmt();
}

function deletePatient(id){
  var p=patients.find(function(x){return x.id===id;});
  if(!confirm(p.last+' '+p.first+' 様を削除しますか？'))return;
  patients=patients.filter(function(x){return x.id!==id;});
  delete checks[id];
  savePts();saveChk();renderCheck();renderMgmt();
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
init();
</script>
</body>
</html>
